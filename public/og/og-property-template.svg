<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0052ff" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-20" y="-20" width="1240" height="670" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Main Card -->
  <rect x="70" y="60" width="1060" height="510" rx="32" fill="#ffffff" filter="url(#shadow)" stroke="rgba(0,0,0,0.06)" stroke-width="1.5" />

  <g transform="translate(130, 120)">
    <!-- Badges Row -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="130" height="36" rx="18" fill="rgba(16, 185, 129, 0.1)" />
      <text x="18" y="23" fill="#059669" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">ПРОДАЖА</text>

      <rect x="145" y="0" width="180" height="36" rx="18" fill="rgba(0, 82, 255, 0.08)" />
      <text x="165" y="23" fill="#0052ff" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">ПРОВЕРЕНО В ЕГРН</text>

      <rect x="340" y="0" width="170" height="36" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="360" y="23" fill="#64748b" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12" font-weight="600">г. Киров, ЮЗР</text>
    </g>

    <!-- Property Address -->
    <text x="0" y="110" fill="#0f172a" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">ул. Солнечная, 31/1</text>

    <!-- Specs Highlight -->
    <g transform="translate(0, 155)">
      <text x="0" y="32" fill="#0052ff" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="36" font-weight="800">2-комн. квартира</text>
      <text x="360" y="32" fill="#cbd5e1" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="32">|</text>
      <text x="390" y="32" fill="#334155" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="36" font-weight="700">54.2 м²</text>
      <text x="530" y="32" fill="#cbd5e1" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="32">|</text>
      <text x="560" y="32" fill="#64748b" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="28" font-weight="500">Этаж 6 / 10</text>
    </g>

    <!-- Key Advantages Cards -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="240" height="54" rx="16" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="20" y="34" fill="#1e293b" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="15" font-weight="600">✨ Отличный ремонт</text>

      <rect x="255" y="0" width="250" height="54" rx="16" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="20" y="34" fill="#1e293b" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="15" font-weight="600" transform="translate(255, 0)">📄 Готова к сделке</text>

      <rect x="520" y="0" width="270" height="54" rx="16" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="20" y="34" fill="#1e293b" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="15" font-weight="600" transform="translate(520, 0)">🏦 Подходит под ипотеку</text>
    </g>

    <!-- Agent & Contact Footer -->
    <g transform="translate(0, 350)">
      <line x1="0" y1="0" x2="860" y2="0" stroke="#f1f5f9" stroke-width="2" />
      <circle cx="20" cy="30" r="20" fill="#0052ff" />
      <text x="13" y="37" fill="#ffffff" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="18" font-weight="700">А</text>

      <text x="52" y="27" fill="#0f172a" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="16" font-weight="700">Александр Ельчугин</text>
      <text x="52" y="45" fill="#64748b" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12">Эксперт по недвижимости · Киров</text>

      <text x="630" y="36" fill="#0052ff" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="20" font-weight="700">+7 (909) 133-17-71</text>
    </g>
  </g>
</svg>