<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-20" y="-20" width="1240" height="670" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="70" y="60" width="1060" height="510" rx="32" fill="#ffffff" filter="url(#shadow)" stroke="rgba(0,0,0,0.06)" stroke-width="1.5" />

  <g transform="translate(130, 125)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="rgba(16, 185, 129, 0.08)" />
    <text x="24" y="24" fill="#059669" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ГИД ПО МИКРОРАЙОНАМ</text>

    <!-- Main Title -->
    <text x="0" y="105" fill="#0f172a" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="50" font-weight="800" letter-spacing="-1">Районы и микрорайоны Кирова</text>
    <text x="0" y="155" fill="#475569" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="22" font-weight="500">Цены на вторичку и новостройки, плюсы, минусы и экология 2026</text>

    <!-- District Badges Grid -->
    <g transform="translate(0, 210)" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="15" font-weight="600">
      <g transform="translate(0, 0)">
        <rect width="180" height="50" rx="14" fill="#f8fafc" stroke="#cbd5e1" />
        <text x="20" y="31" fill="#0f172a">📍 Чистые Пруды</text>
      </g>
      <g transform="translate(195, 0)">
        <rect width="120" height="50" rx="14" fill="#f8fafc" stroke="#cbd5e1" />
        <text x="20" y="31" fill="#0f172a">📍 ЮЗР</text>
      </g>
      <g transform="translate(330, 0)">
        <rect width="130" height="50" rx="14" fill="#f8fafc" stroke="#cbd5e1" />
        <text x="20" y="31" fill="#0f172a">📍 Центр</text>
      </g>
      <g transform="translate(475, 0)">
        <rect width="170" height="50" rx="14" fill="#f8fafc" stroke="#cbd5e1" />
        <text x="20" y="31" fill="#0f172a">📍 Зональный</text>
      </g>
      <g transform="translate(660, 0)">
        <rect width="150" height="50" rx="14" fill="#f8fafc" stroke="#cbd5e1" />
        <text x="20" y="31" fill="#0f172a">📍 Филейка</text>
      </g>
    </g>

    <!-- Footer Bar -->
    <g transform="translate(0, 335)">
      <line x1="0" y1="0" x2="850" y2="0" stroke="#f1f5f9" stroke-width="2" />
      <text x="0" y="36" fill="#0052ff" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="18" font-weight="700">yelchugin.ru/rajony</text>
      <text x="240" y="36" fill="#94a3b8">·</text>
      <text x="260" y="36" fill="#334155" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="16" font-weight="500">Александр Ельчугин · Консультация по выбору района</text>
      <text x="850" y="36" fill="#0f172a" text-anchor="end" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="18" font-weight="700">+7 (909) 133-17-71</text>
    </g>
