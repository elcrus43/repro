<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 150) rotate(90) scale(400)">
      <stop offset="0%" stop-color="#0052ff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0052ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 500) rotate(90) scale(350)">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20" y="-20" width="1240" height="670" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow1)" />
  <rect width="1200" height="630" fill="url(#glow2)" />

  <!-- Modern Architectural Line Grid -->
  <g opacity="0.15" stroke="#0052ff" stroke-width="1.5">
    <path d="M 850 180 L 1050 80 L 1150 130 L 1150 480 L 950 580 L 850 530 Z" fill="none" />
    <path d="M 1050 80 L 1050 480 L 850 530" fill="none" />
    <path d="M 1050 480 L 1150 480" fill="none" />
    <line x1="900" y1="230" x2="900" y2="480" stroke-dasharray="4 4" />
    <line x1="950" y1="210" x2="950" y2="500" stroke-dasharray="4 4" />
    <line x1="1000" y1="190" x2="1000" y2="520" stroke-dasharray="4 4" />
    <line x1="1100" y1="180" x2="1100" y2="420" stroke-dasharray="4 4" />
  </g>

  <!-- Main Card Container -->
  <rect x="70" y="60" width="1060" height="510" rx="32" fill="#ffffff" filter="url(#shadow)" stroke="rgba(0,0,0,0.06)" stroke-width="1.5" />

  <!-- Content Left -->
  <g transform="translate(130, 130)">
    <!-- Badge -->
    <rect x="0" y="0" width="310" height="40" rx="20" fill="rgba(0, 82, 255, 0.08)" />
    <circle cx="20" cy="20" r="5" fill="#0052ff" />
    <text x="36" y="25" fill="#0052ff" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ЭКСПЕРТ ПО НЕДВИЖИМОСТИ</text>

    <!-- Main Title -->
    <text x="0" y="115" fill="#0f172a" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Александр Ельчугин</text>

    <!-- Subtitle -->
    <text x="0" y="170" fill="#475569" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="24" font-weight="500">Покупка, продажа и новостройки в Кирове</text>

    <!-- Bullets -->
    <g transform="translate(0, 230)" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="16" font-weight="600" fill="#1e293b">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="260" height="48" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="20" y="30" fill="#0052ff">✓</text>
        <text x="42" y="29">Новостройки без комиссии</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(280, 0)">
        <rect width="250" height="48" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="20" y="30" fill="#10b981">✓</text>
        <text x="42" y="29">Юридическая проверка</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(550, 0)">
        <rect width="240" height="48" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="20" y="30" fill="#f59e0b">✓</text>
        <text x="42" y="29">Семейная ипотека</text>
      </g>
    </g>

    <!-- Footer Bar -->
    <g transform="translate(0, 330)">
      <line x1="0" y1="0" x2="800" y2="0" stroke="#f1f5f9" stroke-width="2" />
      <text x="0" y="36" fill="#0052ff" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="20" font-weight="700">yelchugin.ru</text>
      <text x="180" y="36" fill="#94a3b8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="20">·</text>
      <text x="210" y="36" fill="#334155" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="18" font-weight="500">Киров, ул. Ленина, 89</text>
      <text x="490" y="36" fill="#94a3b8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="20">·</text>
      <text x="520" y="36" fill="#0f172a" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="18" font-weight="700">+7 (909) 133-17-71</text>
    </g>
  </g>
</svg>