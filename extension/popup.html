<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Realtor Match Import</title>
    <style>
        body { width: 250px; font-family: -apple-system, sans-serif; padding: 16px; margin: 0; }
        .btn { width: 100%; padding: 10px; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; text-align: center; margin-bottom: 8px; font-size: 13px; }
        .btn-primary { background: #2563EB; }
        .btn-primary:hover { background: #1D4ED8; }
        .btn-secondary { background: #10B981; }
        .btn-secondary:hover { background: #059669; }
        #status { margin-top: 12px; font-size: 13px; color: #4B5563; text-align: center; }
    </style>
</head>
<body>
    <div style="font-weight:800; margin-bottom:12px; font-size:16px; color:#2563EB;">Realtor-Match</div>
    <div style="font-size:13px; margin-bottom:16px; color:#6B7280;">Откройте объявление на Авито или ЦИАН:</div>
    <button id="importPropBtn" class="btn btn-primary">Импортировать в Объекты</button>
    <button id="importSelectBtn" class="btn btn-secondary">Импортировать в Подбор</button>
    <div id="status"></div>
    <script src="popup.js"></script>
</body>
</html>
